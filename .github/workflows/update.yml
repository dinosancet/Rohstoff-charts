name: Kurse aktualisieren und veröffentlichen

on:
  schedule:
    # Mo–Fr 22:40 UTC, nach US-Börsenschluss (und Sa früh für Freitagskorrekturen)
    - cron: '40 22 * * 1-5'
    - cron: '0 6 * * 6'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kurse laden
        run: node scripts/fetch-data.mjs
      - name: Daten speichern
        run: |
          git config user.name "kurs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Kurse aktualisiert $(date -u +%F)" && git push)
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/prices.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
